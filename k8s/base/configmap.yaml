apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  namespace: nexus
data:
  ENVIRONMENT: kubernetes
  SEMANTIC_PROVIDER: local
  SHARD_COUNT: "3"
  SHARD_TIMEOUT_SECONDS: "1.5"
  SHARD_MAX_CONCURRENCY: "32"
  CIRCUIT_FAILURE_THRESHOLD: "3"
  CIRCUIT_RECOVERY_SECONDS: "15"
  MAX_INFLIGHT_REQUESTS: "64"
  MIN_READY_SHARDS: "2"
  METRICS_ENABLED: "true"
